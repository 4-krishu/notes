name: notes
description: "Notes + Hidden Vault App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # STORAGE
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # DATE FORMAT
  intl: ^0.18.1

  # MEDIA PICKER (for vault)
  image_picker: ^1.0.7
  file_picker: ^8.3.7

  # PATH (file storage)
  path_provider: ^2.1.2

  # PERMISSIONS (needed for gallery access)
  permission_handler: ^11.3.0

  # SECURITY (vault password hashing + file encryption)
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # VIDEO PLAYBACK (vault)
  video_player: ^2.8.6

  # OPEN DOCUMENTS (vault)
  open_filex: ^4.0.0

  # IMAGE THUMBNAILS (vault grid)
  image: ^4.2.0

  # BIOMETRIC UNLOCK (vault lock screen)
  local_auth: ^2.1.7
  flutter_secure_storage: ^9.2.2

  # INTRUDER SELFIE (vault lock screen)
  camera: ^0.11.1

  # PANIC SHAKE-TO-LOCK (vault)
  sensors_plus: ^6.1.1

  # VIDEO THUMBNAILS (vault grid)
  video_thumbnail: ^0.5.3

  # ENCRYPTED BACKUP (vault)
  archive: ^4.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # HIVE CODE GENERATION
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
